<text x="312.0" y="120.0" font-size="12.5" font-weight="700" font-style="normal" fill="#6b5b8a" text-anchor="start">Sistema NextLeague</text>
<text x="40.0" y="44.0" font-size="22" font-weight="700" font-style="normal" fill="#1f1633" text-anchor="start">NextLeague · Casos de uso: visitante y participante</text>
<text x="40.0" y="68.0" font-size="12.5" font-weight="400" font-style="normal" fill="#6b5b8a" text-anchor="start">Lo que hace cualquier persona sin cuenta, y lo que suma un participante con la sesión iniciada.</text>
<ellipse cx="560" cy="165" rx="130.0" ry="27.0" fill="#ece4ff" stroke="#3b1d6e" stroke-width="1.3"/>
<text x="560.0" y="162.0" font-size="11.5" font-weight="400" font-style="normal" fill="#1f1633" text-anchor="middle">CU-01 Ver la portada</text>
<text x="560.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#1f1633" text-anchor="middle">y las estadísticas</text>
<ellipse cx="560" cy="260" rx="130.0" ry="27.0" fill="#ece4ff" stroke="#3b1d6e" stroke-width="1.3"/>
<text x="560.0" y="257.0" font-size="11.5" font-weight="400" font-style="normal" fill="#1f1633" text-anchor="middle">CU-02 Explorar y</text>
<text x="560.0" y="271.0" font-size="11.5" font-weight="400" font-style="normal" fill="#1f1633" text-anchor="middle">buscar torneos</text>
