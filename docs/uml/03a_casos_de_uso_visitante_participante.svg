<text x="560.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#1f1633" text-anchor="middle">posiciones y llaves)</text>
<ellipse cx="560" cy="450" rx="130.0" ry="27.0" fill="#ece4ff" stroke="#3b1d6e" stroke-width="1.3"/>
<text x="560.0" y="447.0" font-size="11.5" font-weight="400" font-style="normal" fill="#1f1633" text-anchor="middle">CU-04 Ver el calendario</text>
<text x="560.0" y="461.0" font-size="11.5" font-weight="400" font-style="normal" fill="#1f1633" text-anchor="middle">y los resultados</text>
